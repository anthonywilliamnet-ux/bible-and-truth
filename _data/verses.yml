# Daily verses. Add more with the same two lines. One verse per day, in order.
- text: "“For I know the plans I have for you,” declares the Lord, “plans to give you hope and a future.”"
  ref: Jeremiah 29:11
- text: "“Sanctify them in the truth; Your word is truth.”"
  ref: John 17:17
- text: "“Trust in the Lord with all your heart and lean not on your own understanding.”"
  ref: Proverbs 3:5
- text: "“Jesus said to him, ‘I am the way, the truth, and the life.’”"
  ref: John 14:6
- text: "“The Lord is my light and my salvation; whom shall I fear?”"
  ref: Psalm 27:1
- text: "“For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.”"
  ref: John 3:16
- text: "“Thy word is a lamp unto my feet, and a light unto my path.”"
  ref: Psalm 119:105
- text: "“And ye shall know the truth, and the truth shall make you free.”"
  ref: John 8:32
- text: "“Now faith is the substance of things hoped for, the evidence of things not seen.”"
  ref: Hebrews 11:1
